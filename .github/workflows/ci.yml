name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-format:
    name: ESLint & Prettier Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint (frontend)
        working-directory: ./frontend
        run: npm run lint

      - name: Run Prettier check (frontend)
        working-directory: ./frontend
        run: npx prettier --check .

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run ESLint (backend)
        working-directory: ./backend
        run: npm run lint

      - name: Run Prettier check (backend)
        working-directory: ./backend
        run: npx prettier --check .

  lockfile-integrity:
    name: Verify Lockfile Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify frontend lockfile
        working-directory: ./frontend
        run: npm ci --dry-run

      - name: Verify backend lockfile
        working-directory: ./backend
        run: npm ci --dry-run

      - name: Verify Cargo lockfile
        working-directory: ./soroban
        run: cargo check --locked

  # #1688 — fail on misnamed test files, warn on components without tests
  dangling-specs:
    name: Check dangling test files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check for dangling or misnamed specs
        run: node scripts/check-dangling-specs.js

  # #1690 — validate Docker Compose files when they or the env template change
  compose-changes:
    name: Detect compose changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -E '^(\.env\.docker\.example|docker-compose[^/]*\.ya?ml)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  validate-compose:
    name: Validate Docker Compose
    needs: compose-changes
    if: needs.compose-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: docker compose --env-file .env.docker.example -f docker-compose.yml -f docker-compose.monitoring.yml config --quiet
