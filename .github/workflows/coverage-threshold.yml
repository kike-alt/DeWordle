name: Test Coverage Threshold

on: [push, pull_request]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:cov
        env:
          CI: true

      - name: Check coverage thresholds
        run: |
          node -e "
          const fs = require('fs');
          const cov = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
          const lines = cov.total.lines.pct;
          console.log('Line coverage:', lines + '%');
          if (lines < 70) { console.error('Coverage below 70%!'); process.exit(1); }
          console.log('Coverage threshold met.');
          "