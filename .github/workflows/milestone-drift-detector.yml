name: Milestone Drift Detector

on:
  schedule:
    - cron: "0 9 * * 1,4"
  workflow_dispatch:
    inputs:
      drift_days:
        description: "Inactivity threshold in days"
        required: false
        default: "7"
      dry_run:
        description: "Dry run (true/false)"
        required: false
        default: "false"

jobs:
  detect-drift:
    name: Detect Drifting High-Priority Issues
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Detect drifting issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          DRIFT_DAYS: ${{ github.event.inputs.drift_days || '7' }}
          PRIORITY_LABELS: "priority:P0,priority:P1"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          OUTPUT_JSON: "true"
        run: node scripts/milestone-drift-detector.js
