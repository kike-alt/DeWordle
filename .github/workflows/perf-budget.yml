name: Performance Budget CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  bundle-size:
    name: Frontend bundle size check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          ANALYZE: "false"

      - name: Check bundle size against budget (1500 kB JS limit)
        run: |
          BUDGET_KB=1500
          JS_KB=$(find frontend/.next/static/chunks -name '*.js' -exec du -k {} + 2>/dev/null \
            | awk '{sum+=$1} END {print sum}')
          JS_KB=${JS_KB:-0}
          echo "Total JS chunks: ${JS_KB} kB (budget: ${BUDGET_KB} kB)"
          if [ "$JS_KB" -gt "$BUDGET_KB" ]; then
            echo "::error::Bundle size ${JS_KB} kB exceeds budget of ${BUDGET_KB} kB"
            exit 1
          fi
          echo "✅ Bundle within budget"

  lighthouse-budget:
    name: Lighthouse performance budget
    runs-on: ubuntu-latest
    needs: bundle-size
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Start server
        run: npm run start &
        working-directory: frontend

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: ".lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true