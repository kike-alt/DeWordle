name: Release Notes Draft

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: actions/github-script@v9
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const { data: compare } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: await getPreviousTag(),
              head: tag,
            });

            const prs = [];
            for (const commit of compare.commits) {
              const prMatch = commit.commit.message.match(/\(#(\d+)\)/);
              if (prMatch) {
                try {
                  const { data: pr } = await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: parseInt(prMatch[1]),
                  });
                  prs.push(pr);
                } catch {}
              }
            }

            const sections = {
              'On-Chain': [],
              'Backend': [],
              'Frontend': [],
              'DevOps': [],
            };

            for (const pr of prs) {
              const labels = pr.labels.map(l => l.name.toLowerCase());
              let section = 'DevOps';
              if (labels.some(l => l.includes('on-chain') || l.includes('contract') || l.includes('soroban'))) {
                section = 'On-Chain';
              } else if (labels.some(l => l.includes('backend') || l.includes('api'))) {
                section = 'Backend';
              } else if (labels.some(l => l.includes('frontend') || l.includes('ui'))) {
                section = 'Frontend';
              }
              sections[section].push(`- ${pr.title} (#${pr.number})`);
            }

            let body = `## What's Changed\n\n`;
            for (const [section, items] of Object.entries(sections)) {
              if (items.length > 0) {
                body += `### ${section}\n\n${items.join('\n')}\n\n`;
              }
            }

            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Release ${tag}`,
              body,
              draft: true,
            });

            core.info(`Draft release created: ${release.html_url}`);

            async function getPreviousTag() {
              const { data: tags } = await github.rest.repos.listTags({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 10,
              });
              const currentTag = tag;
              for (const t of tags) {
                if (t.name !== currentTag) return t.name;
              }
              return context.payload.repository.default_branch;
            }
